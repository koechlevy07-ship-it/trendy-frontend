name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          poetry install --with dev,test,lint

      - name: Lint (Ruff)
        working-directory: ./backend
        run: poetry run ruff check .

      - name: Type Check (MyPy)
        working-directory: ./backend
        run: poetry run mypy .

      - name: Format Check (Black)
        working-directory: ./backend
        run: poetry run black --check .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Type Check Frontend
        working-directory: ./frontend
        run: npm run typecheck

      - name: Format Check Frontend
        working-directory: ./frontend
        run: npm run format:check

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: volley_test
          POSTGRES_USER: volley
          POSTGRES_PASSWORD: volley
        ports: 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1

      - name: Install Dependencies
        working-directory: ./backend
        run: poetry install --with dev,test

      - name: Run Migrations
        working-directory: ./backend
        run: poetry run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://volley:volley@localhost:5432/volley_test

      - name: Run Tests
        working-directory: ./backend
        run: poetry run pytest -v --cov=app --cov-report=xml --cov-report=term
        env:
          DATABASE_URL: postgresql+asyncpg://volley:volley@localhost:5432/volley_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret
          JWT_ALGORITHM: HS256
          AI_INFERENCE_URL: http://localhost:8001

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Tests
        working-directory: ./frontend
        run: npm run test -- --coverage

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend

      - name: E2E Tests
        working-directory: ./frontend
        run: npm run test:e2e
        env:
          CYPRESS_BASE_URL: http://localhost:5173

  test-ai-engine:
    name: AI Engine Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: volley_test
          POSTGRES_USER: volley
          POSTGRES_PASSWORD: volley
        ports: 5432:5432
      redis:
        image: redis:7-alpine
        ports: 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1

      - name: Install Dependencies
        working-directory: ./ai-engine
        run: poetry install --with dev,test

      - name: Run Tests
        working-directory: ./ai-engine
        run: poetry run pytest -v --cov=. --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://volley:volley@localhost:5432/volley_test
          REDIS_URL: redis://localhost:6379/0

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./ai-engine/coverage.xml
          flags: ai-engine

  docker-build:
    name: Docker Build
    needs: [lint-and-typecheck, test-backend, test-frontend, test-ai-engine]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push AI Engine
        uses: docker/build-push-action@v5
        with:
          context: ./ai-engine
          file: ./ai-engine/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/ai-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          languages: python, javascript, typescript

  deploy-staging:
    name: Deploy Staging
    needs: [docker-build, security-scan]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to Staging
        run: |
          echo "Deploying to staging..."
          # kubectl apply -k infrastructure/kubernetes/overlays/staging

  deploy-production:
    name: Deploy Production
    needs: [docker-build, security-scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Production
        run: |
          echo "Deploying to production..."
          # kubectl apply -k infrastructure/kubernetes/overlays/prod