[tool.poetry]
name = "volley-ai-engine"
version = "0.1.0"
description = "Volleyball Analytics AI Engine"
authors = ["Volleyball Analytics Team <team@volleyball-analytics.com>"]
readme = "README.md"
repository = "https://github.com/your-org/volleyball-analytics-platform"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: PyTorch",
    "License :: OSI Approved :: MIT License",
]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
torch = "2.3.0"
torchvision = "0.18.0"
torchaudio = "2.3.0"
ultralytics = "8.2.0"
opencv-python = "4.9.0.80"
supervision = "0.21.0"
onnxruntime = "1.18.0"
onnx = "1.16.0"
onnxsim = "0.4.33"
paddleocr = "2.8.0"
easyocr = "1.7.0"
mediapipe = "0.10.9"
pillow = "10.0.0"
supervision = "0.21.0"
pyyaml = "6.0.1"
pydantic = "2.7.0"
pydantic-settings = "2.3.0"
python-dotenv = "1.0.1
loguru = "0.7.2"

[tool.poetry.group.dev.dependencies]
pytest = "8.2.0"
pytest-asyncio = "0.23.0"
pytest-cov = "4.1.0"
ruff = "0.4.0"
mypy = "1.9.0"
black = "24.3.0"
pytest-mock = "3.12.0"
pytest-cov = "4.1.0"

[tool.poetry.group.lint.dependencies]
ruff = "0.4.0"
mypy = "1.9.0"
black = "24.3.0"
isort = "5.13.2"

[tool.poetry.group.test.dependencies]
pytest = "8.2.0"
pytest-asyncio = "0.23.0"
pytest-cov = "4.1.0"
pytest-mock = "3.12.0"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "C90", # mccabe
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in default arguments
]
per-file-ignores = {
    "tests/*": ["S101", "S106"],
    "migrations/*": ["S101"],
}
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
indent-width = 4
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_optional = true
strict_concat = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = false
disallow_any_generics = true
disallow_subclassing_any = true
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true

[tool.mypy.plugins]
 = "pydantic.mypy"

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pydantic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pydantic_settings.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jose.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "passlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "ai: AI model tests",
    "api: API endpoint tests",
]

[tool.coverage.run]
source = ["inference", "detection", "tracking", "pose", "ocr", "action", "training"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/alembic/*",
    "*/conftest.py",
    "*/main.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = "*/migrations/*"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "ai: AI model tests",
    "api: API endpoint tests",
]

[tool.coverage.run]
source = ["inference", "detection", "tracking", "pose", "ocr", "action", "training"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/alembic/*",
    "*/conftest.py",
    "*/main.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"